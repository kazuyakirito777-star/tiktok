name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        working-directory: tiktok-chat-mod
        run: gradle build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-live-chat-jar
          path: tiktok-chat-mod/build/libs/tiktok-live-chat-1.0.0.jar
