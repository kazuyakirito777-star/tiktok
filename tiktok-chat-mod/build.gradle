plugins {
    // 1.21.11 masih obfuscated -> pakai varian "remap"
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Library TikTok Live (dibundel ke dalam jar mod lewat jar-in-jar)
    
    implementation "com.github.jwdeveloper.TikTok-Live-Java:Client:${project.tiktok_live_version}"
    include "com.github.jwdeveloper.TikTok-Live-Java:Client:${project.tiktok_live_version}"

    implementation "com.github.jwdeveloper.TikTok-Live-Java:API:${project.tiktok_live_version}"
    include "com.github.jwdeveloper.TikTok-Live-Java:API:${project.tiktok_live_version}"

    implementation "com.google.protobuf:protobuf-java:4.26.1"
    include "com.google.protobuf:protobuf-java:4.26.1"

    implementation "org.java-websocket:Java-WebSocket:1.5.5"
    include "org.java-websocket:Java-WebSocket:1.5.5"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
